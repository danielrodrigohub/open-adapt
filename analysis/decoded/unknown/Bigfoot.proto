    LFT_fileID type = 7;
}
//Used by LFT_TRANSMIT_SEGMENT
message LFTSegment
{
    bool lastSegment = 1;
    uint32 size = 2;
    uint32 crc = 3;
    uint32 segmentNumber = 4;
    bytes payload = 5;
}
//Used by LFT_RETRANSMIT_SEGMENT
message LFTRetransmit
{
    uint32 sequenceNumber = 1;
}
//Used by LFT_STOP_TRANSFER
message LFTStopTransfer
{
    enum Reason
    {
        SUCCESS = 0;
        UNKNOWN = 1;
        FILE_ERROR = 2;
        TIMEOUT = 3;
        DATA_CHANGED = 4;
        POWERING_DOWN = 5;
    }

    Reason reason = 1;
}

message GetLogEntries
{
    uint32 numRecords = 1;
}

message LogData
{
    enum LogType
    {
        ACCEL = 0;
        GYRO = 1;
    }

    uint64 timestamp = 1;
    LogType logType = 2;
    int32 x = 3;
    int32 y = 4;
    int32 z = 5;
}

// returned from firmware with the number of log entries
message NumberLogEntries
{
    uint32 numLogEntries = 1;
}

//Used by SYS_CONFIG_GET_MFG_PRODUCT_ID, SYS_CONFIG_SET_MFG_PRODUCT_ID
message MfgProductId
{
    bytes productID = 1;
}

//Used by BATTERY_GET_HEALTH_METRICS
message BatteryHealthMetrics
{
    int32 start_voltage_mv  = 1;
    int32 end_voltage_mv    = 2;
    int32 voltage_delta_mv  = 3;
    uint32 elapsed_time_sec = 4;
    bool threshold_exceeded = 5;
    uint32 test_id          = 6;
}

//Used by SESSION_GET_STORAGE_SIZE
message SessionStorageAllocation
{
    uint32 totalSize = 1;
}

/////////////////////////////////////////////////////////////////////////////////////////////
// FPS MESSAGES

// Used by TOGGLE_FPS (REQUEST)
message ToggleFPS
{
    bool turnFpsOn = 1;
}

// Used by SYS_CONFIG_GET_FPS_AUTOLACE_TARGET, SYS_CONFIG_SET_FPS_AUTOLACE_TARGET
message SysConfigFPSAutolaceTarget
{
    uint32 autolace_target = 1;
}

// Used by ENABLE_FPS
message EnableFPS
{
    bool is_enabled = 1;
}

message FPSCapsenseValue
{
    uint32 value = 1;
}

message FPSCapsenseErrorStatus
{
    enum FPSStatus
    {
        FPS_ARMED_0 = 0;
        FPS_WAITING_FOR_STAND_1 = 1;
        FPS_UNLACED_2 = 2;
        FPS_IN_SPORT_3 = 3;
        FPS_WAITING_FOR_RESET_4 = 4;
        FPS_STATE_CT = 5;
    }

    FPSStatus status = 1;
}

/////////////////////////////////////////////////////////////////////////////////////////////
// AFPS MESSAGES

// the afps shoe state
enum AfpsShoeState
{
    SHOE_STATE_UNKNOWN = 0;
    SHOE_STATE_OFF = 1;
    SHOE_STATE_ON = 2;
}

// the afps state
message AfpsState
{
    AfpsShoeState state = 1;
}

// sample rate of the afps signal
message AfpsSampleRate
{
    enum SampleRate
    {
        RATE_25_HZ = 0;
        RATE_50_HZ = 1;
        RATE_100_HZ = 2;
        RATE_200_HZ = 3;
    }

    SampleRate rate = 1;
}

// afps state change notification
message AfpsNotification
{
    uint64 timestamp = 1;
    AfpsState state = 2;
}

// afps filter configuration
message AfpsFilterConfiguration
{
    // filter thresholds
    uint32 shoe_off_threshold = 1;
    uint32 low_threshold = 2;
    uint32 high_threshold = 3;

    // filter optimization parameters
    float residual_threshold = 4;
    float variance_threshold = 5;
    float adapt_variance = 6;
    double adapt_offset = 7;

    // decimal bits used in filter math
    uint32 quantization = 8;
}
