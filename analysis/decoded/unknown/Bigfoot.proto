{
    enum Module
    {
        SYSCLK  = 0;
        GPIO    = 1;
        DMA     = 2;
        USART1  = 3;
        USART3  = 4;
        TIM3    = 5;
        TIM5    = 6;
        ADC     = 7;
        I2C1    = 8;
        SPI1    = 9;
        SPI2    = 10;
        SPI3    = 11;
    }

    Module id   = 1;
}

