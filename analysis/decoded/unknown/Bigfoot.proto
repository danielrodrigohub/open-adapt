/////////////////////////////////////////////////////////////////////////////////////////////
// SERVO MESSAGES

// Used by SERVO_MOVE (REQUEST)
message ServoMove
{
    enum ServoCommand
    {
        SERVO_HOME                  = 0;
        SERVO_SHORT_SEGMENT_TIGHTEN = 1;
        SERVO_LONG_SEGMENT_TIGHTEN  = 2;
        SERVO_SHORT_SEGMENT_LOOSEN  = 3;
        SERVO_LONG_SEGMENT_LOOSEN   = 4;
        SERVO_MAX_TIGHTEN           = 5;
        SERVO_MAX_LOOSEN            = 6;
        SERVO_AUTOLACE              = 7;
        SERVO_STOP                  = 8;
        SERVO_HUG                   = 9;
    }

    ServoCommand command = 1;
}

// Used by SERVO_POSITION_GET (ACK) SERVO_POSITION_SET (REQUEST) SERVO_PRESET_GET (ACK) and SERVO_PRESET_SET (ACK)
message ServoPosition
{
    //[0, 100] indicating how tight the laces are from fully loose [0] to fully tightened [100]
    uint32 positionPercentage = 1;
}

// Output by SERVO_STATUS_EVENT (EVENT)
message ServoStatusEvent
{
    enum MoveStatus
    {
        SERVO_STATUS_OK             = 0; // move result status indicating no faults
        SERVO_STATUS_OC             = 1; // move result status indicating over current fault
        SERVO_STATUS_ENC_STALL      = 2; // move result status indicating stall fault
        SERVO_STATUS_EXT_SHUTDOWN   = 3; // move result status indicating external shutdown from motor protection hardware
        SERVO_STATUS_STOPPED        = 4; // move result status indicating move stopped by user/command
        SERVO_STATUS_POLARITY_ERROR = 5; // move result status indicating motor polarity error
        SERVO_STATUS_OVERSPEED      = 6; // move result status indicating encoder overspeed error
    }

    MoveStatus status = 1;
    //[0, 100] indicating how tight the laces are from fully loose [0] to fully tightened [100]
    uint32 positionPercentage = 2;
}

/////////////////////////////////////////////////////////////////////////////////////////////
// DEVICE SETTINGS

// Used by RTC_TIME_GET (ACK) and RTC_TIME_SET (REQUEST)
message RTCPayload
{
    uint32 dow              = 1;
    uint32 month            = 2;
    uint32 day              = 3;
    uint32 year             = 4;
    uint32 hour             = 5;
    uint32 minute           = 6;
    uint32 second           = 7;
}

// Used by RTC_TIME_GET_UTC (ACK) and RTC_TIME_SET_UTC (REQUEST)
message RTCPayloadUTC
{
    uint64 timestampMillis  = 1;
}

// Used by BATTERY_CHARGER_STATE_GET (ACK)
message BatteryChargerState
{
    enum ChargerState
    {
        ON_CHARGER  = 0;
        OFF_CHARGER = 1;
        ON_CHARGING = 2;
        CHARGING_ERROR = 3;
    }

    enum BatteryState
    {
        BATTERY_LOW = 0;
        BATTERY_MID = 1;
        BATTERY_HIGH = 2;
        BATTERY_CRITICAL = 3;
        BATTERY_FULL = 4;
    }

    ChargerState status = 1;
    uint32 batteryVoltage = 2;
    double batteryTemp   = 3;
    uint32 batteryPercent = 4;
    BatteryState batteryState = 5;

}

// Used by SERIAL_NUMBER_GET (REQUEST, ACK)
message GetSerialNumber
{
    enum Module
    {
        SHOE   = 0;
        ENGINE = 1;
        PCA    = 2;
    }

    Module id           = 1;
    string serialNumber = 2;
}

/////////////////////////////////////////////////////////////////////////////////////////////
//  AUTHENTICATION
//  Auth key generation and authentication processes are detailed in
//  CoreRF/docs/AuthenticationSpecification.md


//  Used by START_AUTHENTICATION (ACK)
//  Response message sent by device to phone during imprinting process to generate a secret auth key
message StartAuthenticationKeyGeneration
{
    enum ModPGroup
    {
        //First Oakley Group (id: 1) defined in RFC2409 - 96 bytes
        ONE = 0;
        //Second Oakley Group (id: 2) defined in RFC2409 - 128 bytes
        TWO = 1;
        //1536-bit group (id: 5) defined in RFC3526 - 192 bytes
        FIVE = 2;
        //2048-bit group (id: 14) defined in RFC3526 - 256 bytes
        FOURTEEN = 3;
        //3072-bit group (id: 15) defined in RFC3526 - 384 bytes
        FIFTEEN = 4;
        //4096-bit group (id: 16) defined in RFC3526 - 512 bytes
        SIXTEEN = 5;
        //6144-bit group (id: 17) defined in RFC3526 - 768 bytes
        SEVENTEEN = 6;
        //8192-bit group (id: 18) defined in RFC3526 - 1024 bytes
        EIGHTEEN = 7;
    }
    ModPGroup modpGroupNumber = 1;
}

// Used by EXCHANGE_PUBLIC_KEY (REQUEST) and EXCHANGE_PUBLIC_KEY (ACK)
//  Message sent by phone to device during auth key generation process and
//  response message sent by device to phone during auth key generation process detailed in
message ExchangePublicKey
{
    bytes publicKey = 1;
}

// Used by START_AUTHENTICATION (REQUEST)
//  Message sent by phone to authenticate with device and access protected services and commands.
message StartAuthenticationRequest
{
    //Nonce is 16 bytes
    bytes phoneNonce = 1;
}

// Used by START_AUTHENTICATION (ACK)
//  Response message sent by device to phone during the authentication process
message StartAuthenticationACK
{
    //Nonces are 16 bytes
    bytes encryptedPhoneNonce = 1;
    bytes deviceNonce = 2;
}

// Used by AUTHENTICATION_CHALLENGE (REQUEST)
//  Sent by phone to device in second phase of authentication process
message AuthenicationChallenge
{
    //Nonce is 16 bytes
    bytes encryptedDeviceNonce = 1;
}



