// Used by USER_ANIMATION_SET_ANIMATION (REQUEST)
message UserAnimationSetAnimation
{
    uint32 animation_id     = 1;    //Id specified by app

    uint32 red_output   = 2;        //Color settings
    uint32 green_output = 3;
    uint32 blue_output  = 4;

    uint32 prequel_ms       = 5;    //Pulse cycle settings
    uint32 enter_time_ms    = 6;
    uint32 on_time_ms       = 7;
    uint32 exit_time_ms     = 8;
    uint32 off_time_ms      = 9;
    uint32 sequel_ms        = 10;
}

// Used by USER_ANIMATION_GET_ANIMATION (ACK and EVENT)
message UserAnimationGetAnimation
{
    uint32 animation_id     = 1;    //Id specified by app
    uint32 time_remaining_sec = 2; //how much time the animation will remain running in seconds

    enum UserAnimationState
    {
        USER_ANIMATION_STATE_RUNNING        = 0;    //Animation is currently running
        USER_ANIMATION_STATE_STOPPED        = 1;    //Animation is not currently running, hasn't been started or was cancelled
        USER_ANIMATION_STATE_QUEUED         = 2;    //Animation is queued to run after current system animation finishes
        USER_ANIMATION_STATE_INTERRUPTED    = 3;    //Animation is interrupted by a running system animation, it will run after the system animation completes if there is time remaining
    }
    UserAnimationState state = 3; //Current run state of the animation

    enum UserAnimationEndStatus
    {
        USER_ANIMATION_END_STATUS_NOT_SET           = 0;    //Status already read or animation never started
        USER_ANIMATION_END_STATUS_TIMEOUT           = 1;    //Animation completed
        USER_ANIMATION_END_STATUS_CANCELED          = 2;    //Animation cancelled by app request
        USER_ANIMATION_END_STATUS_BATTERY_OVERTEMP  = 3;    //battery overtemp forced the cancellation
        USER_ANIMATION_END_STATUS_CRITICAL_BATTERY  = 4;    //critical battery level forced the cancellation
    }
    UserAnimationEndStatus end_status = 4; //If the animation is finished, this shows the reason why
}

// Used by USER_ANIMATION_START_ANIMATION   (REQUEST)
message UserAnimationStart
{
    uint32 timeout = 1; //how much time the animation will run in seconds
}

//
// Animation 2.x Definitions (bigfoot & trillium)
//
message AnimationLine
{
    message LEDS
    {
        message RGBS
        {
            uint32 red = 1;     // range valid from [0 - 255]
            uint32 green = 2;   // range valid from [0 - 255]
            uint32 blue = 3;    // range valid from [0 - 255]
        }

        RGBS led1 = 1;
        RGBS led2 = 2;
        RGBS led3 = 3;
    }

    LEDS leds = 1;
    uint32 frameDurationMs = 2; // range valid from [0 - 65535]
}

message AnimationMap
{
    repeated AnimationLine rgbArray = 1;
}

message UserAnimationMap
{
    uint32 type = 1;            // range valid from [0 - 65535] Note: 0 = bigfoot
    uint32 id = 2;              // range valid from [0 - 65535]
    bool interruptable = 3;
    bool resumable = 4;         // animation will resume after a system animation interrupts
    uint32 repeatCount = 5;     // range valid from [0 - 65535] Sets the number of repeat plays (use 0 if only 1 animation play is desired)
    uint32 repeatDelayMs = 6;   // range valid from [0 - 65535]
    uint32 cycleLengthMs = 7;
    AnimationMap data = 8;      // frames of led data (total document size must be below 4KB)
}

// Used by USER_ANIMATION_GET_ANIMATION for Lighting 2.0
message CustomAnimationGetAnimation
{
    enum CustomAnimationState
    {
        CUSTOM_ANIMATION_STATE_RUNNING        = 0;    //Animation is currently running
        CUSTOM_ANIMATION_STATE_STOPPED        = 1;    //Animation is not currently running, hasn't been started or was cancelled
        CUSTOM_ANIMATION_STATE_QUEUED         = 2;    //Animation is queued to run after current system animation finishes
        CUSTOM_ANIMATION_STATE_INTERRUPTED    = 3;    //Animation is interrupted by a running system animation, it will run after the system animation completes if there is time remaining
    }
    enum CustomAnimationEndStatus
    {
        CUSTOM_ANIMATION_END_STATUS_NOT_SET           = 0;    //Status already read or animation never started
        CUSTOM_ANIMATION_END_STATUS_TIMEOUT           = 1;    //Animation completed
        CUSTOM_ANIMATION_END_STATUS_CANCELED          = 2;    //Animation cancelled by app request
        CUSTOM_ANIMATION_END_STATUS_BATTERY_OVERTEMP  = 3;    //battery overtemp forced the cancellation
        CUSTOM_ANIMATION_END_STATUS_CRITICAL_BATTERY  = 4;    //critical battery level forced the cancellation
    }
    uint32 id = 1;                          // range valid from [0 - 65535]
    uint32 timeRemainingMs = 2;
    CustomAnimationState state = 3;
    CustomAnimationEndStatus endStatus = 4;
}

// Used by FIRMWARE_UPLOAD
message FirmwareUpload
{
    uint32 image_id             = 1;
    bool wait_for_completion    = 2;
}

// Used by FIRMWARE_GET_IMAGE_STATS
message FirmwareUploadImageStatsRequest
{
    uint32 image_id = 1;
}
message FirmwareUploadImageStatsAck
{
    enum Status
    {
        FW_IMG_NOT_INITIALIZED = 0;           // image is in unknown state - not initialized
        FW_IMG_BLANK           = 1;           // image storage area is erased
        FW_IMG_PARTIAL         = 2;           // image is partially downloaded
        FW_IMG_REJECTED        = 3;           // user has declined updating to this image
        FW_IMG_READY           = 4;           // image is ready to be uploaded to target device
        FW_IMG_CURRENT         = 5;           // image has been uploaded to target device
        FW_IMG_BAD_CHKSUM      = 6;           // image fails checksum verification
        FW_IMG_UPLOADING       = 7;           // image upload has been initiated
        FW_IMG_NON_FUNC        = 8;           // image has failed to run after upload is complete
    }

    uint32 major_version        = 1;
    uint32 minor_version        = 2;
    uint32 revision             = 3;
    uint32 day                  = 4;
    uint32 month                = 5;
    uint32 year                 = 6;
    Status status               = 7;
    uint32 image_size           = 8;
    uint32 downloaded_image_size = 9;
    uint32 image_checksum       = 10;
    uint32 image_data_checksum  = 11;
}

// Used by FIRMWARE_GET_UPGRADE_STATUS
message FirmwareUpgradeStatus
{
    enum Status
    {
        FW_UPGRADE_SUCCESS = 0;
        FW_UPGRADE_FAIL = 1;
        FW_UPGRADE_READY = 2;
        FW_UPGRADE_IN_PROGRESS = 3;
        FW_UPGRADE_FAIL_LOW_BATTERY = 4;
    }
    Status status = 1;
}

